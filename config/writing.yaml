rules:
  a_share_companies: 禁止A股具体公司名称、简称及股票代码，包括A/H双重上市公司；港股独有公司可写，未知身份待核。基金管理人、基金及指数身份不能误判为个股。
  index_identity: 允许有依据的跟踪指数名称、代码和结构；关键词路由不是成份或持仓证据。
  performance: 禁止六个月及以内的基金或指数涨跌幅、收益率及翻倍等变体；期限不明先待核，不误禁产业经营同比、利率与股息率。
  product_flows: 禁止产品规模、总份额及增减、净流入流出、净申赎、对应排名与连续天数，也不能换成吸金或资金追捧。A/C类份额名称不属于总份额数据。
  turnover: 有来源的成交额、成交量可以使用；比较需同口径，不据此推断净流入或基本面。
  market_flows: 市场南向与产品资金分开，无去向证据不推断南向专买红利。
  support: 计划、预测、报道、分析分开；同现不等于因果；不得承诺收益或虚构稀缺性、持仓和最新数据。
  sources: 引用必须来自本轮材料；只有搜索摘要或模型自报引文不能算原文；转引不能改标Wind直接数据。
  human_control: 人工主线和必写项优先，补料须人工采用，确认框架后才生成正文，绝不自动发布。
