# Per model input, including source context and complete public style examples.
max_input_characters: 48000
rules:
  a_share_companies: 标题与正文禁止A股、港股具体上市公司名称、简称及股票代码；未知身份待核。产品正式名称与代码正常保留；来源区保留真实出处，不将公司事实冒充行业事实。
  index_identity: 底层指数资料仅供内部核对；标题与正文不出现跟踪指数名称、代码或独立指数介绍。产品正式名称、代码不误禁。用有依据的产品覆盖方向和相关特点说明关系。
  performance: 禁止六个月及以内的基金或指数涨跌幅、收益率及翻倍等变体；期限不明先待核，不误禁产业经营同比、利率与股息率。
  product_flows: 不写产品规模、份额、净流入、净申购等精确量值；允许有来源、有统计区间的连续增持趋势及天数，不附金额或新增份额。A/C类份额名称不属于总份额数据。
  turnover: 有来源的成交额、成交量可以使用；比较需同口径，不据此推断净流入或基本面。
  market_flows: 市场南向与产品资金分开，无去向证据不推断南向专买红利。
  support: 计划、预测、报道、分析分开；同现不等于因果；不得承诺收益或虚构稀缺性、持仓和最新数据。
  sources: 引用必须来自本轮材料；只有搜索摘要或模型自报引文不能算原文；转引不能改标Wind直接数据。
  human_control: 人工主线和必写项优先，框架内补搜材料单列建议；用户确认含新增资料的最终框架后才进入正文，不自动改动人工选材，绝不自动发布。
