version: editorial-style-20261002-v1
common:
  - 主新闻用具体主体、时间和动作开篇；每段增加事实或理解，按新闻关系组织而非依次复述来源。
  - 标题突出本次变化，自然承接正式产品名；有证据才写数字、资金或趋势，不机械模仿样例力度词。
  - 行业、资金、政策可以并列或择一作主线，材料不足时明确缺口，不填空泛段落凑篇幅。
  - 产品特点解释本次主题与覆盖方向的联系；固定产品、管理人介绍及风险尾部由模板组装。
  - 样例只用于写法；代码、名称、日期、统计对象、量值和预测阶段均以本期已核材料为准。
  - 编辑实际删改和重排正文，删除重复机制、无增量收尾与说明书式铺陈。
products:
  '513130':
    sample_count: 5
    emphasis: AI应用商业化、港股科技经营与流动性变化
    patterns:
      - 政策或模型、应用进展可先交代具体新动作，再展开商业场景、投入或经营信号。
      - 资金和海外流动性是独立有效主线；有板块去向证据才将南向资金与科技相连。
      - 产品数据可以靠前衔接，但不能用规模或成交变化倒推新闻影响；产业关系落到本题业务方向。
    avoid:
      - 沿用范文错码520500、旧持有人数字或旧交易数据。
      - 把模型发布、融资、收入兑现混成同一阶段，或反复宣称商业化拐点。
  '588710':
    sample_count: 4
    emphasis: 半导体上游设备与材料的需求、扩产、交付和经营变化
    patterns:
      - 产业数据、业绩、政策或展会可作起点，随后解释它对应设备材料的哪个需求环节。
      - 用订单、资本开支、交期、扩产或经营数据补充行业联系；产量、出口、利润与预测分别归因。
      - 有证据的产品资金或活跃度可独立成段，不默认产业新闻优于资金，也不逐家公司罗列。
    avoid:
      - 堆积单家公司细节，或将下游需求直接写成设备企业已确认收入。
      - 复制历史涨幅比较、旧行业比例和旧风险估值数字。
  dividend_family:
    sample_count: 4
    emphasis: 分红兑现、利率环境、配置需求与A股港股红利差异
    patterns:
      - 分红、利率或资金均可作主新闻，围绕一条主线选择互补证据，避免机械写成三重催化。
      - 区分拟派与已派、股息率与债券收益率、机构观点与已发生配置行为。
      - 南向资金有去向证据时可作港股红利主线；七成员按市场、低波、央企和质量特点自然承接。
    avoid:
      - 把七成员系列当单只基金、固定权重组合，或合计规模冒充单产品数字。
      - 强行把利率变化写成确定上涨，或反复抄写七成员介绍与风险尾部。
