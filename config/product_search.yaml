products:
  '588090':
    categories:
    - technology
    background_sources:
    - gov_policy_library
    keyword_queries:
    - 科创50 上证科创板50成份指数 样本调整 公告 生效日期
    - 科创板 业绩 研发 商业化 并购 高端装备 新能源 生物医药
    - 科创板 半导体 人工智能 经营 需求 订单
    - 科创50ETF华泰柏瑞 588090 科创50 估值 成交 份额
    source_questions:
      nbs_public: 最新工业生产发布中的集成电路产量、电子制造增加值及投资有何变化，分别是什么统计期？
      semi_china_public: 核对最新设备出货、硅片需求、晶圆厂投资和行业会议公开资料；区分报告首次发布与会议重述日期。
      gov_policy_library: 科创板、科技创新融资或并购重组有什么新公开政策，公告与实施日期是什么，影响范围能否核对？
      miit: 科创产业经营、研发或高端装备有何新披露，统计期和实际进展是什么；行业整体不能代替科创50成份股数据？
      nda: 数据与AI应用有哪些新政策或商业化进展，其实际阶段和适用范围是什么，不能推断为科创50整体收入？
      csia: 芯片设计、制造、设备与材料各环节有何新经营信息，能否追溯原始公告；涉及公司的科创50成份身份需另核？
      trendforce: 半导体、AI硬件和终端需求有何新数据，统计期、预测与实际值分别是什么，行业结论不能直接当科创50整体表现？
      semi: 制造投资与需求有哪些新统计，范围与期间是什么，对科创50的覆盖仍需成份股证据？
      cls_semiconductor_materials: 半导体经营与供需有什么新公开摘要，能否找到原始披露，其与科创50具体样本的联系有哪些待核实之处？
      wscn_technology: 科创板科技企业的业绩、研发与商业化有什么新披露，实际结果和预期如何区分，能否追溯公司公告？
    observation_queries: &id001
    - id: production
      name: 国内生产与电子制造
      source_id: nbs_public
      query: 集成电路 产量 亿块
      match_terms:
      - 集成电路
      - 电子制造
      - integrated circuit
    - id: equipment
      name: 全球设备出货与资本开支
      source_id: semi_china_public
      query: 半导体设备 出货 季度
      match_terms:
      - 出货
      - billings
      - equipment sales
    - id: fab_investment
      name: 晶圆厂与存储投资预测
      source_id: semi_china_public
      query: 300mm 存储 设备投资
      match_terms:
      - 存储
      - 晶圆厂
      - 300mm
      - memory
      - fab outlook
    - id: wafer_demand
      name: 硅片及终端需求
      source_id: semi_china_public
      query: 硅片 季度 需求
      match_terms:
      - 硅片
      - silicon wafer
    - id: industry_meeting
      name: 行业会议新进展
      source_id: semi_china_public
      query: IC WORLD 半导体
      match_terms:
      - IC WORLD
      - 大会
      - 产业展望
