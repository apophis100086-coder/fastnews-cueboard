version: product-search-v2-targeted-evidence
note: 领域来源与关键词双路检索；分类和词表仅用于检索，不代表当前持仓。
max_queries: 8
site_queries: 4
evidence: {max_events: 3, max_pages_per_event: 2}
products:
  "513130":
    categories: [hk, technology]
    background_sources: [gov_policy_library]
    keyword_queries: [港股科技 平台经营 云计算 AI应用, 大模型 智能体 商业化 收入, 消费电子 自动驾驶 业务进展, 恒生科技 南向资金 监管 指数调整]
    source_questions:
      trendforce: AI服务器、云计算或终端需求有何新披露的数据及统计期，传导范围是否涉及相关业务？
      csia: 芯片及算力产业链有什么新披露的订单、验证或投产阶段，能否找到原始公开出处？
      miit: 平台、AI应用和云业务相关政策是征求意见、公告还是已实施，公布与生效日期分别是什么？
      nda: 数据和AI应用的新政策或项目处于什么阶段，有哪些可核对的公开依据？
      cls_southbound: 港股南向成交净买额出现何种同口径变化，是否有去向证据，币种及交易日是什么？
      hkex_official_news: 交易所公开新闻有哪些影响科技资产交易环境的新安排，范围与生效时间是什么？
  "513530":
    categories: [hk]
    background_sources: [gov_policy_library]
    keyword_queries: [港股 高股息 分红 派息 现金流, 港股通 南向资金 净买入, 利率 国债收益率 红利 估值, 银行 运营商 能源 公用事业 经营]
    source_questions:
      cls_southbound: 南向成交净买额有什么同口径增量，单位币种与交易日是什么，是否明确披露买入去向？
      eastmoney_hsgt: 已存南向成交统计是否有可核对的交易日、币种及公开时间，不能用额度余额替代净买额？
      ubs_southbound: 公开研究是否披露港股配置或利率变化的新依据，不能把观点当资金流事实？
      hkex_official_news: 公开新闻有何港股通或市场安排的新变化，其公告时间、实施时间与影响范围是什么？
  "588710":
    categories: [technology]
    background_sources: [gov_policy_library]
    keyword_queries: [半导体设备 晶圆厂 资本开支 订单, 光刻 刻蚀 薄膜沉积 客户验证, HBM DRAM NAND 先进封装, 半导体材料 供需 国产替代]
    source_questions:
      csia: 半导体设备订单、客户导入、材料或工艺有何新进展，主体、验证与量产阶段及原始出处是什么？
      semi: 晶圆厂制造扩产、资本开支或设备订单有哪些新公布数据，统计期、预测与实际值如何区分？
      trendforce: 存储、先进封装及材料供需有哪些新数据，订单、报价与预测各自的口径及统计期是什么？
      miit: 制造扩产、设备及材料政策有什么新公告，规划、获批与实际投产分别有哪些依据？
      nda: 算力建设的新公告是否包含明确硬件采购或项目阶段，不能从AI表述推断设备订单？
      cls_semiconductor_materials: 半导体材料供需和客户导入有何新披露，公开摘要给出的原始出处与实际阶段是什么？
      wscn_technology: 晶圆厂资本开支和设备供应商新披露了什么，能否追溯公开公告而非重复旧摘要？
      gov_policy_library: 半导体设备及制造相关政策有何新公开调整，公开日期和未来实施安排是什么？
  "517120":
    categories: [medicine]
    background_sources: [hkex_news]
    keyword_queries: [创新药 临床 三期 研究终点, NMPA FDA 新药 批准 范围, 创新药 License-out 首付款 里程碑, 医保 支付准入 ADC 双抗 商业化]
    source_questions:
      fda: 新药批准或适应症扩展的新公告是什么，药名、批准范围、日期与研究阶段如何区分？
      nmpa: 新药审批有哪些新公开线索，受理、审评、批准分别处于什么阶段，原始日期是什么？
      cde: 新受理或临床进展涉及哪些药物，登记、突破性疗法与上市批准不能混同，日期是否可核对？
      clinicaltrials: 重要药物研究有哪些新登记或结果更新，研究阶段、终点与更新日期是什么？
      medcube: 公开索引中的授权交易有哪些新线索，首付款、潜在里程碑和消息的原始出处是什么？
      cls_innovative_drug: 临床、授权和商业化有哪些新公开摘要，如何追溯具体公告及统计口径？
      wscn_medicine: 创新药商业化或支付准入有何新报道，实际收入与预期金额如何区分？
