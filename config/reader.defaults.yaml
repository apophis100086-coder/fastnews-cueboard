# Host CLI runs use the host account's quota. These are local task limits;
# internal model requests and token limits are controlled by the host.
timeout_seconds: 480
max_input_characters: 24000
# User-authorized: no project-imposed daily task cap. Host account limits still apply.
max_tasks_per_day: null
max_product_items: 60
max_morning_items: 60
max_web_sources: 60
max_refs_per_item: 4
